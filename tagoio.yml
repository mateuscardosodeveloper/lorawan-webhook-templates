template-id: tagoio
name: TagoIO
description: Integrate with TagoIO
logo-url: https://files.us-e1.tago.io/5bbcb03b667d7a002e56664b/storage/logo-tagoio.avif
info-url: https://tago.io/
documentation-url: https://community.tago.io/t/how-to-integrate-tagoio-with-ttn-v3/374
tts-documentation-url: https://www.thethingsindustries.com/docs/integrations/cloud-integrations/tagoio/
fields:
  - id: auth
    name: Authorization
    description: TagoIO Authorization
    secret: true
  - id: region
    name: Region
    # The TagoIO Region where your application is hosted:
    # - us-e1: United States East Coast (Virginia)
    # - eu-w1: European Union West (Ireland)
    description: The TagoIO region where your application is hosted. Choose between the United States (us-e1) or the European Union (eu-w1). Default (us-e1).
    secret: false
    default: us-e1
    optional: true
format: json
headers:
  Authorization: "{auth}"
  Content-Type: application/json
create-downlink-api-key: true
base-url: https://ttn.middleware.{region}.tago.io
paths:
  uplink-message: /uplink
